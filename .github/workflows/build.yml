name: Build firmware

on:
  push:
    paths-ignore:
      - 'android/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Use example secrets for the CI build
        run: cp include/secrets.example.h include/secrets.h
      - name: Build
        run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-example-config
          path: .pio/build/esp32-s3/firmware.bin
