name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WifiSwitch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WifiSwitch-apk
          path: WifiSwitch.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Wi-Fi Switch app v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: WifiSwitch.apk
          body: "Download WifiSwitch.apk on your Android phone and open it to install (allow 'install unknown apps')."
